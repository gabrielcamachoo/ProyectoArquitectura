_format_version: '3.0'

consumers:
  - username: academic-platform
    jwt_secrets:
      - key: auth-jwt-key
        algorithm: RS256
        rsa_public_key: |
__JWT_PUBLIC_KEY__

services:
  - name: auth-service
    url: http://auth-service:3000
    routes:
      - name: auth-public
        paths:
          - /auth/register
          - /auth/login
          - /auth/refresh
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: auth-protected
        paths:
          - /auth/logout
          - /auth/users
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
              - http://localhost:5173
              methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              headers:
              - Authorization
              - Content-Type
              credentials: true
__JWT_PLUGIN__

  - name: course-service
    url: http://course-service:3000
    routes:
      - name: course-routes
        paths:
          - /courses
        strip_path: false
        plugins:
__JWT_PLUGIN__

  - name: assessment-service
    url: http://assessment-service:3000
    routes:
      - name: assessment-routes
        paths:
          - /evaluations
          - /attempts
        strip_path: false
        plugins:
__JWT_PLUGIN__

  - name: progress-service
    url: http://progress-service:3000
    routes:
      - name: progress-routes
        paths:
          - /progress
        strip_path: false
        plugins:
__JWT_PLUGIN__

  - name: adaptive-service
    url: http://adaptive-service:3000
    routes:
      - name: adaptive-routes
        paths:
          - /recommendations
        strip_path: false
        plugins:
__JWT_PLUGIN__

  - name: collaboration-service
    url: http://collaboration-service:3000
    routes:
      - name: collaboration-routes
        paths:
          - /forums
          - /study-groups
          - /tutoring
        strip_path: false
        plugins:
__JWT_PLUGIN__

  - name: analytics-service
    url: http://analytics-service:3000
    routes:
      - name: analytics-routes
        paths:
          - /analytics
        strip_path: false
        plugins:
__JWT_PLUGIN__

  - name: notification-service
    url: http://notification-service:3000
    routes:
      - name: notification-routes
        paths:
          - /notifications
        strip_path: false
        plugins:
__JWT_PLUGIN__

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      limit_by: consumer
