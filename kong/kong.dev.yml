_format_version: '3.0'

services:
  - name: auth-service
    url: http://auth-service:3000
    routes:
      - name: auth-routes
        paths:
          - /auth
          - /users
        strip_path: false

  - name: course-service
    url: http://course-service:3000
    routes:
      - name: course-routes
        paths:
          - /courses
        strip_path: false

  - name: assessment-service
    url: http://assessment-service:3000
    routes:
      - name: assessment-routes
        paths:
          - /evaluations
          - /attempts
        strip_path: false

  - name: progress-service
    url: http://progress-service:3000
    routes:
      - name: progress-routes
        paths:
          - /progress
        strip_path: false

  - name: adaptive-service
    url: http://adaptive-service:3000
    routes:
      - name: adaptive-routes
        paths:
          - /recommendations
        strip_path: false

  - name: collaboration-service
    url: http://collaboration-service:3000
    routes:
      - name: collaboration-routes
        paths:
          - /forums
          - /study-groups
          - /tutoring
        strip_path: false

  - name: analytics-service
    url: http://analytics-service:3000
    routes:
      - name: analytics-routes
        paths:
          - /analytics
        strip_path: false

  - name: notification-service
    url: http://notification-service:3000
    routes:
      - name: notification-routes
        paths:
          - /notifications
        strip_path: false

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      limit_by: ip
