_format_version: '3.0'

consumers:
  - username: academic-platform
    jwt_secrets:
      - key: auth-jwt-key
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAuGk6lIdGQpX7nY6KdFXO
          /ouxdVlyOqmvcvUdkO8SUIvEFpX/gotMB3niKMTNB1IhF8LwIue/xhMZNvaV7KAl
          cGfdfYlgtS7VFr4Uru3sq7bVMs1kVbnDDJP32C10t4cyY/S65t866gUSS1fMfj0V
          qGmLg5KfYxx7G89/oLakkZRGbrsfdfHsBrekFgLqcUZodxQXLzYChYnSX+/PIlHN
          q6Ia/H3gyXg1Zg7JwzUHxq7yC0avi7HhrQogUxeIhMbPjA7JAmPxuvAB5RXINPNu
          6+DVWwwpuZKe8FQn4jSxTQWTp5FhkUNHmfgL+K1NajwIIlDBhw8+O2vtBTe4P7WX
          9wIDAQAB
          -----END PUBLIC KEY-----

services:
  - name: auth-service
    url: http://auth-service:3000
    routes:
      - name: auth-public
        paths:
          - /auth/register
          - /auth/login
          - /auth/refresh
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: auth-protected
        paths:
          - /auth/logout
          - /auth/users
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
              - http://localhost:5173
              methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              headers:
              - Authorization
              - Content-Type
              credentials: true
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: course-service
    url: http://course-service:3000
    routes:
      - name: course-routes
        paths:
          - /courses
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: assessment-service
    url: http://assessment-service:3000
    routes:
      - name: assessment-routes
        paths:
          - /evaluations
          - /attempts
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: progress-service
    url: http://progress-service:3000
    routes:
      - name: progress-routes
        paths:
          - /progress
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: adaptive-service
    url: http://adaptive-service:3000
    routes:
      - name: adaptive-routes
        paths:
          - /recommendations
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: collaboration-service
    url: http://collaboration-service:3000
    routes:
      - name: collaboration-routes
        paths:
          - /forums
          - /study-groups
          - /tutoring
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: analytics-service
    url: http://analytics-service:3000
    routes:
      - name: analytics-routes
        paths:
          - /analytics
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: notification-service
    url: http://notification-service:3000
    routes:
      - name: notification-routes
        paths:
          - /notifications
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      limit_by: consumer
