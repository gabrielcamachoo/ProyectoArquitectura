_format_version: '3.0'

consumers:
  - username: academic-platform
    jwt_secrets:
      - key: auth-jwt-key
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1pg+R2dcxKb0VIphRZZ3
          B4hQIhPJh0/y2n7xIWI6n6uBILJBdC+F8jzO4bDgXLsPmX1sLIHBRqI0tk0jT5kU
          NcMXgAUU6/324y1Pcj5yJRcbiWqP136PniqJJwOwEiyd4x788Jk1EDt+KZaA/9pO
          Yf2bRPDLEdVcYKHINiP31a8ovCSkp62IVg10xKYtBKQjF8mPKEiCij0l9LH9BCGO
          M8hiuQCcLFqcNtoBAzNwX1gVdLmTUsfqmn+od7aPUhUfF+93dfdkbysY1PK3jFTp
          4fnxyxnbeFMF23sM0CkBaoU9777hlx0UAGk+WLmR+usalMEfWAUzr0B/wn8wO+lH
          RQIDAQAB
          -----END PUBLIC KEY-----

services:
  - name: auth-service
    url: http://auth-service:3000
    routes:
      - name: auth-public
        paths:
          - /auth/register
          - /auth/login
          - /auth/refresh
        methods:
          - POST
        strip_path: false
      - name: auth-protected
        paths:
          - /auth/logout
          - /auth/users
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: course-service
    url: http://course-service:3000
    routes:
      - name: course-routes
        paths:
          - /courses
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: assessment-service
    url: http://assessment-service:3000
    routes:
      - name: assessment-routes
        paths:
          - /evaluations
          - /attempts
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: progress-service
    url: http://progress-service:3000
    routes:
      - name: progress-routes
        paths:
          - /progress
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: adaptive-service
    url: http://adaptive-service:3000
    routes:
      - name: adaptive-routes
        paths:
          - /recommendations
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: collaboration-service
    url: http://collaboration-service:3000
    routes:
      - name: collaboration-routes
        paths:
          - /forums
          - /study-groups
          - /tutoring
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: analytics-service
    url: http://analytics-service:3000
    routes:
      - name: analytics-routes
        paths:
          - /analytics
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: notification-service
    url: http://notification-service:3000
    routes:
      - name: notification-routes
        paths:
          - /notifications
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      limit_by: consumer
