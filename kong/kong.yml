            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: progress-service
    url: http://progress-service:3000
    routes:
      - name: progress-routes
        paths:
          - /progress
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: adaptive-service
    url: http://adaptive-service:3000
    routes:
      - name: adaptive-routes
        paths:
          - /recommendations
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: collaboration-service
    url: http://collaboration-service:3000
    routes:
      - name: collaboration-routes
        paths:
          - /forums
          - /study-groups
          - /tutoring
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: analytics-service
    url: http://analytics-service:3000
    routes:
      - name: analytics-routes
        paths:
          - /analytics
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: notification-service
    url: http://notification-service:3000
    routes:
      - name: notification-routes
        paths:
          - /notifications
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      limit_by: consumer
  - name: cors
    config:
      origins:
      - http://localhost:5173
      methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
      headers:
      - Authorization
      - Content-Type
      - Accept
      - Origin
      credentials: true
      preflight_continue: false
