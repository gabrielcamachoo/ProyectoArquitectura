name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '20'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Build workspace packages
        run: |
          npm run build --workspaces --if-present

  build-and-push-images:
    needs: test-and-build
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGES: ${{ secrets.DOCKER_USERNAME && 'true' || 'false' }}
    strategy:
      matrix:
        service: [auth-service, course-service, assessment-service, collaboration-service, notification-service, progress-service, analytics-service, adaptive-service, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU and Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to registry (optional)
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and push if credentials present)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.base
          builder: default
          push: ${{ env.PUSH_IMAGES }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository_owner }}/proyecto-${{ matrix.service }}:{{ github.sha }}
          build-args: |
            SERVICE_WORKSPACE=${{ matrix.service }}
