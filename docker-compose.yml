services:
  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - '8000:8000'
      - '8001:8001'
    depends_on:
      - auth-service
      - course-service
      - assessment-service

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  postgres-replica:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'

  auth-service:
    build: ./services/auth-service
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - '3000:3000'

  course-service:
    build: ./services/course-service
    env_file: .env
    environment:
      PORT: 3001
    ports:
      - '3001:3000'

  assessment-service:
    build: ./services/assessment-service
    env_file: .env
    environment:
      PORT: 3002
    ports:
      - '3002:3000'

  progress-service:
    build: ./services/progress-service
    env_file: .env
    environment:
      PORT: 3003
    ports:
      - '3003:3000'

  adaptive-service:
    build: ./services/adaptive-service
    env_file: .env
    environment:
      PORT: 3004
    ports:
      - '3004:3000'

  collaboration-service:
    build: ./services/collaboration-service
    env_file: .env
    environment:
      PORT: 3005
    ports:
      - '3005:3000'

  analytics-service:
    build: ./services/analytics-service
    env_file: .env
    environment:
      PORT: 3006
      DATABASE_READ_URL: postgresql://postgres@postgres-replica:5432/proyecto
    ports:
      - '3006:3000'

  notification-service:
    build: ./services/notification-service
    env_file: .env
    environment:
      PORT: 3007
    ports:
      - '3007:3000'

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - '5173:5173'
    depends_on:
      - kong

volumes:
  postgres_data:
