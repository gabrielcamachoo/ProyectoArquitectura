services:
  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /opt/kong-config/kong.yml
      KONG_CONFIG_DIR: /opt/kong-config
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong:/opt/kong-config
      - ./scripts:/opt/kong-scripts:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -f /opt/kong-config/jwt-public.pem ]; then
          node /opt/kong-scripts/build-kong-config.mjs
        else
          cp /opt/kong-config/kong.dev.yml /opt/kong-config/kong.yml
          echo "Kong: modo desarrollo sin JWT (ejecute node scripts/generate-jwt-keys.mjs para producción)"
        fi
        exec /docker-entrypoint.sh kong docker-start
    ports:
      - '8000:8000'
      - '8001:8001'
    depends_on:
      auth-service:
        condition: service_started
      course-service:
        condition: service_started
      assessment-service:
        condition: service_started
      progress-service:
        condition: service_started
      adaptive-service:
        condition: service_started
      collaboration-service:
        condition: service_started
      analytics-service:
        condition: service_started
      notification-service:
        condition: service_started
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  postgres-replica:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'

  auth-service:
    build: ./services/auth-service
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - '3000:3000'

  course-service:
    build: ./services/course-service
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - '3001:3000'

  assessment-service:
    build: ./services/assessment-service
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - '3002:3000'

  progress-service:
    build: ./services/progress-service
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - '3003:3000'

  adaptive-service:
    build: ./services/adaptive-service
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - '3004:3000'

  collaboration-service:
    build: ./services/collaboration-service
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - '3005:3000'

  analytics-service:
    build: ./services/analytics-service
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_READ_URL: postgresql://postgres:postgres@postgres-replica:5432/proyecto
    ports:
      - '3006:3000'

  notification-service:
    build: ./services/notification-service
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - '3007:3000'

  dotnet-service:
    build: ./services/dotnet-service
    ports:
      - '5000:5000'

  jee-service:
    build: ./services/jee-service
    ports:
      - '8081:8081'

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - '5173:5173'
    depends_on:
      - kong

volumes:
  postgres_data:
